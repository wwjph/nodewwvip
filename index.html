<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色地球 · 环保行动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #f4f9f4;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        nav {
            background: #1e8449;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .section {
            margin-bottom: 50px;
        }

        .section h2 {
            color: #27ae60;
            margin-bottom: 15px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 calc(33% - 20px);
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #2ecc71;
        }

        footer {
            background: #145a32;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .card {
                flex: 1 1 100%;
            }

            header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🌱 绿色地球</h1>
    <p>保护环境，从你我做起</p>
</header>

<nav>
    <a href="#about">关于环保</a>
    <a href="#actions">环保行动</a>
    <a href="#tips">生活小贴士</a>
</nav>

<div class="container">

    <section id="about" class="section">
        <h2>🌍 关于环保</h2>
        <p>
            环境保护是人类可持续发展的基础。减少污染、节约资源、保护生态，是我们每个人的责任。
        </p>
    </section>

    <section id="actions" class="section">
        <h2>🚀 环保行动</h2>
        <div class="cards">
            <div class="card">
                <h3>垃圾分类</h3>
                <p>正确分类垃圾，减少污染，提高资源利用率。</p>
            </div>
            <div class="card">
                <h3>节约用水</h3>
                <p>随手关水龙头，合理使用水资源。</p>
            </div>
            <div class="card">
                <h3>低碳出行</h3>
                <p>多步行、骑行或乘坐公共交通工具。</p>
            </div>
        </div>
    </section>

    <section id="tips" class="section">
        <h2>💡 生活小贴士</h2>
        <div class="cards">
            <div class="card">
                <h3>减少塑料</h3>
                <p>使用环保袋，拒绝一次性塑料制品。</p>
            </div>
            <div class="card">
                <h3>节约用电</h3>
                <p>不用电器时及时关闭电源。</p>
            </div>
            <div class="card">
                <h3>绿色消费</h3>
                <p>选择环保产品，支持可持续发展。</p>
            </div>
        </div>
    </section>

</div>

<footer>
    <p>© 2026 绿色地球 | 环保从现在开始</p>
</footer>

</body>
</html>
